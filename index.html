<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First HTML Page</title>
</head>
<body>

    <!-- Heading -->
    <h1>Welcome to My Website</h1>

    <!-- Paragraph -->
    <p>This is my first HTML page. I am learning HTML basics.</p>

    <!-- Link -->
    <a href="https://www.google.com" target="_blank">Go to Google</a>

    <!-- List -->
    <h2>My Hobbies</h2>
    <ul>
        <li>Reading</li>
        <li>Music</li>
        <li>Coding</li>
    </ul>

    <!-- Table -->
    <h2>My Details</h2>
    <table border="1">
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>City</th>
        </tr>
        <tr>
            <td>Mayur</td>
            <td>22</td>
            <td>Mumbai</td>
        </tr>
    </table>

    <!-- Form -->
    <h2>Contact Form</h2>
    <form>
        Name: <input type="text" name="name"><br><br>
        Email: <input type="email" name="email"><br><br>
        Message: <textarea name="message"></textarea><br><br>
        <input type="submit" value="Send">
    </form>

</body>
</html>
